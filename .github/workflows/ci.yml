name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Automation_mcp_agent/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 Automation_mcp_agent

      - name: Run basic tests (placeholder)
        run: |
          echo "No formal tests yet. Add pytest or other test runners here."

      - name: Build Docker image
        run: |
          docker build -t automation-mcp-agent ./Automation_mcp_agent

      - name: Deploy artifact (placeholder)
        run: |
          echo "Add deployment steps here (e.g., push Docker image, deploy to cloud, etc.)"
